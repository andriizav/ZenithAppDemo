<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Таймер — стиль iOS (демо)</title>
<style>
  :root{
    --bg:#000;
    --group:#1c1c1e;
    --group-2:#2c2c2e;
    --sep:rgba(255,255,255,0.10);
    --text:#fff;
    --label:#98989f;
    --tint:#5b9cf5;
    --work:#30d158;
    --rest:#ff9f0a;
    --warmup:#ffd60a;
    --cooldown:#0a84ff;
    --done:#30d158;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
body{
     font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
     background:#111;color:var(--text);
     display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;
     overflow:auto;
   }

.phone{
     width:390px;
     max-width:90vw;
     height:auto;
     aspect-ratio:390/844;
     max-height:92vh;
     background:var(--bg);
     border-radius:54px;border:11px solid #1a1a1a;
     box-shadow:0 40px 90px rgba(0,0,0,.6),inset 0 0 0 2px #000;
     position:relative;overflow:hidden;display:flex;flex-direction:column;
   }
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:140px;height:32px;background:#000;border-radius:0 0 20px 20px;z-index:60}
  .statusbar{height:54px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 8px;font-size:14px;font-weight:600;z-index:55}
  .statusbar .ic{display:flex;gap:6px;align-items:center}
  .statusbar svg{width:17px;height:17px}

  .app{flex:1;display:flex;flex-direction:column;min-height:0}
  .screen{flex:1;display:none;flex-direction:column;min-height:0;overflow-y:auto;padding:4px 16px 100px}
  .screen.active{display:flex}

  /* big title like iOS nav */
  .nav-title{text-align:center;font-size:17px;font-weight:600;padding:2px 0 10px}

  /* ---------- Timer ---------- */
  .phase{text-align:center;font-size:13px;font-weight:600;letter-spacing:.4px;color:var(--label);margin-top:6px;text-transform:uppercase}
  .phase.work{color:var(--work)} .phase.rest{color:var(--rest)}
  .phase.warmup{color:var(--warmup)} .phase.cooldown{color:var(--cooldown)} .phase.done{color:var(--done)}

  .ring-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:280px;position:relative}
  .ring{transform:rotate(-90deg)}
  .ring .track{fill:none;stroke:rgba(255,255,255,.10);stroke-width:9}
  .ring .prog{fill:none;stroke:var(--tint);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .3s linear,stroke .4s}
  .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .time{font-size:76px;font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:-2px;line-height:1}
  .time.work{color:var(--work)} .time.rest{color:var(--rest)}
  .time.warmup{color:var(--warmup)} .time.cooldown{color:var(--cooldown)} .time.done{color:var(--done)}
  .round-sub{margin-top:8px;font-size:15px;color:var(--label);font-weight:500}

  .dots{display:flex;justify-content:center;gap:8px;margin:2px 0 6px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--group-2);transition:.2s}
  .dot.done{background:var(--work)}
  .dot.current{background:#fff;box-shadow:0 0 8px rgba(255,255,255,.6)}

  .controls{display:flex;align-items:center;justify-content:center;gap:40px;padding-bottom:4px}
  .tbtn{background:none;border:none;color:var(--label);font-size:16px;font-weight:500;cursor:pointer}
  .tbtn:active{opacity:.5}
  .play{width:84px;height:84px;border-radius:50%;background:var(--tint);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 24px rgba(91,156,245,.4)}
  .play:active{transform:scale(.95)}
  .play svg{width:34px;height:34px}

  /* ---------- Grouped iOS list ---------- */
  .group{background:var(--group);border-radius:14px;overflow:hidden;margin:18px 0}
  .group .row{display:flex;align-items:center;min-height:50px;padding:10px 16px;position:relative}
  .group .row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
  .row .rl{font-size:16px;flex:1}
  .row .rr{display:flex;align-items:center;gap:10px;color:var(--label);font-size:16px}
  .stepper{display:flex;align-items:center;gap:0}
  .stepper button{width:30px;height:30px;border:none;background:var(--group-2);color:#fff;font-size:20px;border-radius:8px;cursor:pointer}
  .stepper button:active{background:#3a3a3c}
  .stepper .val{min-width:34px;text-align:center;font-size:17px;font-weight:600;color:var(--text)}
  .group-title{font-size:13px;color:var(--label);text-transform:uppercase;letter-spacing:.4px;margin:22px 16px 7px;font-weight:600}

  /* presets as chips */
  .chips{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:9px 16px;border-radius:999px;background:var(--group);color:var(--text);font-size:14px;font-weight:500;border:none;cursor:pointer;white-space:nowrap}
  .chip.active{background:var(--tint);color:#fff}
  .chip:active{opacity:.7}

  /* list rows with checkmark */
  .check{color:var(--tint);opacity:0;width:20px;height:20px}
  .check svg{width:20px;height:20px}
  .row.active .check{opacity:1}
  .row.active .rl{color:var(--text)}
  .sub{font-size:13px;color:var(--label);margin-top:2px}

  /* ---------- Tab bar ---------- */
  .tabbar{position:absolute;left:0;right:0;bottom:0;height:82px;background:rgba(22,22,22,.92);backdrop-filter:blur(22px);border-top:.5px solid var(--sep);display:flex;padding:0 6px 18px;z-index:50}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;color:var(--label);cursor:pointer;font-size:10px;font-weight:500}
  .tab svg{width:25px;height:25px}
  .tab.active{color:var(--tint)}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="statusbar">
    <span id="clock">9:41</span>
    <div class="ic">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 17h2v-5H2v5zm4 0h2V8H6v9zm4 0h2V11h-2v6zm4 0h2V4h-2v13zm4 0h2v-8h-2v8z"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 13a7 7 0 0 1 14 0"/><path d="M8 16a4 4 0 0 1 8 0"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="7" width="18" height="10" rx="2"/><rect x="4" y="9" width="13" height="6" rx="1" fill="#000"/></svg>
    </div>
  </div>

  <div class="app">
    <!-- TIMER -->
    <section class="screen active" id="scr-timer">
      <div class="nav-title">Таймер</div>
      <div class="phase idle" id="phase">Готово</div>
      <div class="ring-wrap">
        <svg class="ring" width="280" height="280" viewBox="0 0 280 280">
          <circle class="track" cx="140" cy="140" r="125"></circle>
          <circle class="prog" id="ring" cx="140" cy="140" r="125"></circle>
        </svg>
        <div class="center">
          <div class="time idle" id="time">00:00</div>
          <div class="round-sub" id="rsub"></div>
        </div>
      </div>
      <div class="dots" id="dots"></div>
      <div class="controls">
        <button class="tbtn" onclick="resetTimer()">Скинути</button>
        <button class="play" id="play" onclick="toggle()">
          <svg id="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="tbtn" onclick="skip()">Далі</button>
      </div>

      <div class="group-title">Параметри</div>
      <div class="group">
        <div class="row"><div class="rl">Робота</div>
          <div class="rr"><div class="stepper"><button onclick="step('work',-1)">−</button><span class="val" id="vWork">20</span><button onclick="step('work',1)">+</button></div><span style="width:14px">хв</span></div></div>
        <div class="row"><div class="rl">Перерва</div>
          <div class="rr"><div class="stepper"><button onclick="step('rest',-1)">−</button><span class="val" id="vRest">10</span><button onclick="step('rest',1)">+</button></div><span style="width:14px">хв</span></div></div>
        <div class="row"><div class="rl">Підходи</div>
          <div class="rr"><div class="stepper"><button onclick="step('rounds',-1)">−</button><span class="val" id="vRounds">8</span><button onclick="step('rounds',1)">+</button></div></div></div>
      </div>

      <div class="group-title">Шаблони</div>
      <div class="chips" id="chips"></div>
    </section>

    <!-- PRESETS -->
    <section class="screen" id="scr-presets">
      <div class="nav-title">Шаблони</div>
      <div class="group-title" style="margin-top:8px">Обрати пресет</div>
      <div class="group" id="presetList"></div>
    </section>

    <!-- SOUNDS -->
    <section class="screen" id="scr-sounds">
      <div class="nav-title">Звуки</div>
      <div class="group-title" style="margin-top:8px">Сигнали</div>
      <div class="group" id="soundList"></div>
    </section>
  </div>

  <nav class="tabbar">
    <button class="tab active" data-s="timer" onclick="go(this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/></svg>Таймер</button>
    <button class="tab" data-s="presets" onclick="go(this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/><circle cx="9" cy="6" r="2" fill="var(--bg)"/><circle cx="15" cy="12" r="2" fill="var(--bg)"/><circle cx="7" cy="18" r="2" fill="var(--bg)"/></svg>Шаблони</button>
    <button class="tab" data-s="sounds" onclick="go(this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><circle cx="12" cy="12" r="4"/></svg>Звуки</button>
  </nav>
</div>

<script>
const cfg={work:20,rest:10,rounds:8,warmup:0,cooldown:0};
let phase="idle",left=0,round=0,running=false,tick=null;
const RING=2*Math.PI*125, ring=document.getElementById("ring");
ring.style.strokeDasharray=RING;

const presets=[
  {name:"Класичний",work:20,rest:10,rounds:8},
  {name:"Табата",work:0.2,rest:0.1,rounds:8},
  {name:"Pomodoro",work:25,rest:5,rounds:4},
  {name:"Силове",work:45,rest:20,rounds:5},
  {name:"Швидке",work:10,rest:5,rounds:6},
];
let active=0;
const sounds=[
  {name:"Стандартний біп",desc:"Початок і кінець фази"},
  {name:"Тріоль",desc:"3 тони перед фінішем"},
  {name:"Дзвін",desc:"Завершення таймера"},
  {name:"Барабан",desc:"Ритмічний відлік"},
];

function clock(){const d=new Date();document.getElementById("clock").textContent=d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")}
setInterval(clock,1000);clock();

function go(t){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById("scr-"+t.dataset.s).classList.add("active")}

const $=id=>document.getElementById(id);
const fmt=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const lab=p=>({idle:"Готово",warmup:"Розминка",work:"Робота",rest:"Перерва",cooldown:"Заминка",done:"Готово"}[p]);
const col=p=>({idle:"var(--label)",warmup:"var(--warmup)",work:"var(--work)",rest:"var(--rest)",cooldown:"var(--cooldown)",done:"var(--done)"}[p]);

function setPhase(p){phase=p;$("phase").className="phase "+p;$("phase").textContent=lab(p);$("time").className="time "+p;}

function render(){
  $("time").textContent=fmt(left);
  const total=phase==="idle"?cfg.work*60:phase==="warmup"?cfg.warmup*60:phase==="cooldown"?cfg.cooldown*60:phase==="work"?cfg.work*60:cfg.rest*60;
  ring.style.strokeDashoffset=RING*(1-(total?left/total:0));
  ring.style.stroke=col(phase);
  $("rsub").textContent=(phase==="work"||phase==="rest")?`Підхід ${round} з ${cfg.rounds}`:"";
  const d=$("dots");d.innerHTML="";
  if(phase==="idle"||phase==="done"){for(let i=0;i<cfg.rounds;i++){const e=document.createElement("div");e.className="dot";d.appendChild(e)}}
  else for(let i=0;i<cfg.rounds;i++){const e=document.createElement("div");e.className="dot"+(i<round-1?" done":"")+(i===round-1?" current":"");d.appendChild(e)}
}
function next(){
  if(phase==="idle"){phase=cfg.warmup>0?"warmup":"work";round=1}
  else if(phase==="warmup"){phase="work";round=1}
  else if(phase==="work"){phase=round<cfg.rounds?"rest":"cooldown";if(phase==="cooldown"&&cfg.cooldown===0)phase="done"}
  else if(phase==="rest"){round++;phase=(round>cfg.rounds)?(cfg.cooldown>0?"cooldown":"done"):"work"}
  else if(phase==="cooldown")phase="done";
  if(phase==="done"){finish();return}
  left=(phase==="warmup"?cfg.warmup:phase==="cooldown"?cfg.cooldown:phase==="work"?cfg.work:cfg.rest)*60;setPhase(phase);render();
}
function start(){if(phase==="idle"||phase==="done"){round=1;next()}running=true;$("icon").innerHTML='<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';clearInterval(tick);tick=setInterval(()=>{left-=0.25;if(left<=0){next();if(phase==="done")return}else render()},250)}
function pause(){running=false;clearInterval(tick);$("icon").innerHTML='<path d="M8 5v14l11-7z"/>';$("time").style.opacity=.5}
function toggle(){$("time").style.opacity=1;running?pause():start()}
function reset(){running=false;clearInterval(tick);phase="idle";round=0;left=cfg.work*60;$("icon").innerHTML='<path d="M8 5v14l11-7z"/>';setPhase("idle");render()}
function skip(){if(phase==="idle"||phase==="done"){start();return}clearInterval(tick);next();if(running)start()}

function step(k,d){cfg[k]=Math.max(k==="rounds"?1:0,(cfg[k]||0)+(k==="rounds"?d:d* (k==="work"||k==="rest"?1:1)));if(cfg[k]>600)cfg[k]=600;$("v"+({work:"Work",rest:"Rest",rounds:"Rounds"}[k])).textContent=cfg[k];reset()}

// presets chips + list
function renderChips(){const c=$("chips");c.innerHTML="";presets.forEach((p,i)=>{const b=document.createElement("button");b.className="chip"+(i===active?" active":"");b.textContent=p.name;b.onclick=()=>{applyPreset(i)};c.appendChild(b)})}
function renderPresets(){const l=$("presetList");l.innerHTML="";presets.forEach((p,i)=>{const r=document.createElement("div");r.className="row"+(i===active?" active":"");r.innerHTML=`<div><div class="rl">${p.name}</div><div class="sub">${p.work} хв · ${p.rest} хв · ${p.rounds} підходів</div></div><div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>`;r.onclick=()=>applyPreset(i);l.appendChild(r)})}
function applyPreset(i){const p=presets[i];cfg.work=p.work;cfg.rest=p.rest;cfg.rounds=p.rounds;active=i;$("vWork").textContent=p.work;$("vRest").textContent=p.rest;$("vRounds").textContent=p.rounds;renderChips();renderPresets();reset()}
function renderSounds(){const l=$("soundList");l.innerHTML="";sounds.forEach(s=>{const r=document.createElement("div");r.className="row";r.innerHTML=`<div><div class="rl">${s.name}</div><div class="sub">${s.desc}</div></div><div class="check" style="opacity:.4;color:var(--label)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>`;r.onclick=()=>{l.querySelectorAll(".row").forEach(x=>x.classList.remove("active"));r.classList.add("active")};l.appendChild(r)})}

setPhase("idle");reset();renderChips();renderPresets();renderSounds();
</script>
</body>
</html>
