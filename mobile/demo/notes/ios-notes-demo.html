<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Нотатки — iOS (демо)</title>
<style>
  :root{
    --bg:#000; --group:#1c1c1e; --group2:#2c2c2e;
    --sep:rgba(255,255,255,.12); --text:#fff; --label:#98989f; --tint:#5b9cf5;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
    background:#111;color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}

  .phone{width:390px;height:844px;max-height:94vh;background:var(--bg);border-radius:54px;border:11px solid #1a1a1a;
    box-shadow:0 40px 90px rgba(0,0,0,.6),inset 0 0 0 2px #000;position:relative;overflow:hidden;display:flex;flex-direction:column}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:140px;height:32px;background:#000;border-radius:0 0 20px 20px;z-index:60}
  .statusbar{height:54px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 8px;font-size:14px;font-weight:600;z-index:55}
  .statusbar .ic{display:flex;gap:6px;align-items:center}
  .statusbar svg{width:17px;height:17px}

  .app{flex:1;display:flex;flex-direction:column;min-height:0}
  .screen{flex:1;display:none;flex-direction:column;min-height:0;overflow-y:auto}
  .screen.active{display:flex}

  /* nav */
  .nav{display:flex;align-items:center;justify-content:space-between;padding:4px 18px 6px}
  .nav .title{font-size:32px;font-weight:700;letter-spacing:.2px}
  .nav .act{background:none;border:none;color:var(--tint);font-size:16px;cursor:pointer;display:flex;align-items:center}
  .nav .act svg{width:24px;height:24px}

  /* segmented */
  .seg{position:relative;display:flex;background:rgba(118,118,128,.24);border-radius:9px;padding:2px;height:34px;margin:6px 16px 10px}
  .seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 2px);border-radius:7px;background:#3a3a3c;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .25s cubic-bezier(.4,.2,.2,1)}
  .seg button{position:relative;z-index:1;flex:1;border:none;background:none;color:rgba(255,255,255,.55);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:color .2s}
  .seg button.active{color:#fff}

  /* search */
  .search{margin:0 16px 10px;background:var(--group2);border-radius:10px;height:38px;display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--label)}
  .search svg{width:16px;height:16px;opacity:.7}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:16px;font-family:inherit}
  .search input::placeholder{color:var(--label)}

  /* list */
  .list{background:var(--group);border-radius:14px;margin:0 16px;overflow:hidden}
  .row{padding:12px 16px;position:relative;cursor:pointer}
  .row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
  .row .t{font-size:17px;font-weight:600}
  .row .s{font-size:14px;color:var(--label);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .d{font-size:12px;color:var(--label);margin-top:3px}

  /* editor */
  .editor{flex:1;padding:10px 18px;display:flex;flex-direction:column;min-height:0}
  .editor .etitle{font-size:24px;font-weight:700;outline:none;border:none;background:none;color:var(--text);font-family:inherit}
  .editor .etitle::placeholder{color:var(--label)}
  .editor .ebody{flex:1;margin-top:10px;font-size:16px;line-height:1.5;color:#e5e5ea;outline:none;border:none;background:none;resize:none;font-family:inherit}
  .editor .ebody::placeholder{color:var(--label)}
  .toolbar{display:flex;gap:22px;justify-content:center;padding:12px 0 4px;color:var(--label)}
  .toolbar svg{width:22px;height:22px}

  /* tab bar */
  .tabbar{position:absolute;left:0;right:0;bottom:0;height:82px;background:rgba(22,22,22,.92);backdrop-filter:blur(22px);border-top:.5px solid var(--sep);display:flex;padding:0 6px 18px;z-index:50}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;color:var(--label);cursor:pointer;font-size:10px;font-weight:500}
  .tab svg{width:25px;height:25px}
  .tab.active{color:var(--tint)}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="statusbar">
    <span>9:41</span>
    <div class="ic">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 17h2v-5H2v5zm4 0h2V8H6v9zm4 0h2V11h-2v6zm4 0h2V4h-2v13zm4 0h2v-8h-2v8z"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 13a7 7 0 0 1 14 0"/><path d="M8 16a4 4 0 0 1 8 0"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="7" width="18" height="10" rx="2"/><rect x="4" y="9" width="13" height="6" rx="1" fill="#000"/></svg>
    </div>
  </div>

  <div class="app">
    <!-- NOTES LIST -->
    <section class="screen active" id="scr-list">
      <div class="nav">
        <div class="title">Нотатки</div>
        <button class="act" onclick="compose()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>

      <div class="seg" id="seg">
        <div class="thumb"></div>
        <button type="button" class="active" data-view="list" onclick="switchView('list',this)">Нотатки</button>
        <button type="button" data-view="edit" onclick="switchView('edit',this)">Редагування</button>
      </div>

      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input placeholder="Пошук">
      </div>

      <div class="list" id="list"></div>
    </section>

    <!-- EDITOR -->
    <section class="screen" id="scr-edit">
      <div class="nav">
        <button class="act" style="color:var(--label)" onclick="switchView('list')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="title" style="font-size:17px" id="editNav">Редагування</div>
        <button class="act" onclick="done()">Готово</button>
      </div>

      <div class="editor">
        <input class="etitle" id="eTitle" placeholder="Заголовок">
        <textarea class="ebody" id="eBody" placeholder="Почніть вводити текст…"></textarea>
        <div class="toolbar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4h12M6 4v4M6 4 9 9h6l3-5M9 9 6 20h12l-3-11"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M5 12a2 2 0 1 0 0 4h14a2 2 0 1 0 0-4M5 12a2 2 0 1 1 0-4h14a2 2 0 1 1 0 4"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </div>
      </div>
    </section>
  </div>

  <nav class="tabbar">
    <button class="tab active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Нотатки</button>
    <button class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18M3 12h18M3 17h18"/></svg>Папки</button>
    <button class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Налаштування</button>
  </nav>
</div>

<script>
  const notes=[
    {title:"Ідеї проєкту",body:"Додати екран налаштувань і синхронізацію з gist.",date:"Сьогодні 09:14"},
    {title:"Список покупок",body:"Молоко, хліб, кава, олівці для малювання.",date:"Вчора 18:02"},
    {title:"Плани на тиждень",body:"Понеділок — тренування. Середа — зустріч.",date:"Пн, 12:40"},
    {title:"Книги для прочитання",body:"«Атлант розправив плечі», «Гайдамацький щоденник».",date:"Нд, 21:15"},
    {title:"Завдання таймера",body:"Зробити мобільний вигляд як у нативного додатку.",date:"Сьогодні 11:03"},
  ];
  const listEl=document.getElementById("list");
  function renderList(){
    listEl.innerHTML="";
    notes.forEach((n,i)=>{
      const r=document.createElement("div");r.className="row";
      const sub=n.body.length>42?n.body.slice(0,42)+"…":n.body;
      r.innerHTML=`<div class="t">${n.title||"Нова нотатка"}</div><div class="s">${sub}</div><div class="d">${n.date}</div>`;
      r.onclick=()=>openNote(i);
      listEl.appendChild(r);
    });
  }
  const seg=document.getElementById("seg");
  const thumb=seg.querySelector(".thumb");
  function switchView(v,btn){
    document.getElementById("scr-list").classList.toggle("active",v==="list");
    document.getElementById("scr-edit").classList.toggle("active",v==="edit");
    const idx=btn?seg.querySelectorAll("button").indexOf(btn):0;
    if(btn) seg.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b===btn));
    if(thumb) thumb.style.transform=`translateX(${v==="edit"?100:0}%)`;
  }
  function openNote(i){
    const n=notes[i];
    document.getElementById("eTitle").value=n.title;
    document.getElementById("eBody").value=n.body;
    switchView("edit");
    // позначити активну кнопку сегмента
    seg.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.view==="edit"));
    thumb.style.transform="translateX(100%)";
  }
  function compose(){
    document.getElementById("eTitle").value="";
    document.getElementById("eBody").value="";
    switchView("edit");
    seg.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.view==="edit"));
    thumb.style.transform="translateX(100%)";
    document.getElementById("eTitle").focus();
  }
  function done(){ switchView("list"); }

  renderList();
</script>
</body>
</html>
